 document.getElementById('app').innerHTML=`<header><a class="brand" href="#">◈ &nbsp; AwaitLab <small>EXPERIMENT REPORT</small></a><span class="local">● 本地报告 · 无网络请求</span></header><main><div class="eyebrow">ASYNC PERFORMANCE / ${esc(report.scenario||'CUSTOM WORKLOAD')}</div><h1>把优化方向，交给实验。</h1><p class="intro">${esc(report.title||'异步工作负载测量')}。额外等待与真实替换分开报告，结果可以逐个批次核对。</p><div class="context"><span>${cfg.blocks} 个配对批次</span><span>每批 ${cfg.requests} 个请求</span><span>${cfg.concurrency} 个闭环并发 worker</span><span>样本输出按请求 ID 核对</span>${report.transport?`<span>${esc(report.transport)}</span>`:''}</div><div class="layout"><section class="overview"><div class="section-title"><h2>01 &nbsp; 端到端响应变化</h2><span>负值表示更快 · 毫秒</span></div><div class="chart"><div class="axis-label"><span>← 更快</span><span>更慢 →</span></div><svg viewBox="0 0 580 ${report.comparisons.length*56+25}" role="img" aria-label="各实验臂响应时间变化与百分位bootstrap区间"><line x1="${scale(0)}" x2="${scale(0)}" y1="0" y2="${report.comparisons.length*56}" stroke="#b8c4cd" stroke-dasharray="3 5"/>${report.comparisons.map((x,i)=>{const y=i*56+24,a=x.effect.ci95_delta_ms,color=x.kind==='replacement'?'#58a58c':'#c79757';return `<text x="1" y="${y+4}" fill="#7c8c99" font-size="11">${esc(x.site)}</text><line x1="${scale(a[0])}" x2="${scale(a[1])}" y1="${y}" y2="${y}" stroke="${color}" stroke-width="5"/><circle cx="${scale(x.effect.mean_delta_ms)}" cy="${y}" r="5" fill="${color}"/><text x="${scale(x.effect.mean_delta_ms)}" y="${y+21}" text-anchor="middle" fill="#6c7d89" font-size="10">${num(x.effect.mean_delta_ms)} ms</text>`}).join('')}</svg><p class="hint">线段：按配对批次均值重采样的 95% 百分位区间。多组比较属探索性结果，不是生产环境效果保证。</p></div><div class="arms">${report.comparisons.map((x,i)=>`<button data-arm="${i}" class="arm ${i===selected?'active':''}"><span class="arm-kind ${x.kind}">${x.kind==='replacement'?'真实替换':'等待干预'}</span><strong>${esc(names[x.name]||x.name)}</strong><span>${num(x.effect.mean_change_pct,1)}% <i>→</i></span></button>`).join('')}</div><div class="card constraints"><h3>这份报告能说明什么</h3><p>等待干预测量操作变慢时的响应敏感度；真实替换测量已提供实现的实际变化。不能把等待敏感度反向当成“优化 50% 会快多少”。</p><p>同一请求 ID 的输出哈希一致，只说明这些已测输入没有观察到输出差异；不证明所有输入的业务语义等价。</p><details><summary>查看完整方法与环境</summary><p>${esc(report.method)}</p><ul>${report.limitations.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><pre>${esc(JSON.stringify(report.environment||{},null,2))}</pre></details></div></section><section class="detail"><div class="section-title"><h2>02 &nbsp; ${esc(names[c.name]||c.name)}</h2></div><div class="card"><span class="badge ${real?'green':'amber'}">${real?'真实实现 A/B':'协作式等待实验'}</span><h2>${real?statusText(c):'测量对额外等待的敏感度'}</h2><div class="metrics"><div><small>平均响应变化</small><strong class="${real?(c.candidate_improvement?'good':'neutral'):(e.mean_delta_ms<0?'good':'')}">${num(e.mean_change_pct,1)}<em>%</em></strong></div><div><small>控制组 → 实验组</small><b>${num(c.control_mean_ms)} → ${num(c.treatment_mean_ms)} <em>ms</em></b></div></div><div class="evidence"><span>均值差区间</span><b>[${e.ci95_delta_ms.map(x=>num(x)).join(', ')}] ms</b><span>输出核对</span><b>${c.output_equivalence?'已测输入逐项一致':'存在不一致'}</b></div>${!real?`<div class="timing-note">名义增加 ${num(c.delay_ms)} ms / 次，负载下实际平均增加 ${num(c.observed_injection_mean_ms)} ms / 次。${c.timer_overshoot_warning?'实际等待明显超出设定值；结果按实测等待归一化。':''}</div>`:''}${real?`<p class="hint">实用门槛：点估计改善至少 ${report.settings.min_gain_pct??5}%；Holm 调整 p=${num(c.holm_adjusted_p,4)}。${c.randomization?.exact?'精确配对随机化检验。':'未使用可分级的精确检验。'} 本轮支持不等于改善幅度下界，也不构成已注册的确认性结论。</p>`:''}<p class="hint">p95 描述性变化 ${num(c.descriptive_p95_change_pct,1)}%；不提供尾分位的显著性结论。</p></div><div class="card"><h3>逐批次核对</h3><div class="scroll"><table><thead><tr><th>批次</th><th>执行顺序</th><th>控制组</th><th>实验组</th><th>输出</th></tr></thead><tbody>${c.blocks.map(b=>`<tr><td>${b.block+1}</td><td>${b.order[0]==='control'?'控制 → 实验':'实验 → 控制'}</td><td>${num(b.control.latency.mean_ms)} ms</td><td>${num(b.treatment.latency.mean_ms)} ms</td><td>${b.outputs_equal?'✓ 一致':'× 不一致'}</td></tr>`).join('')}</tbody></table></div></div><div class="card"><div class="section-title"><h3>采样任务时间线</h3><div class="trace-controls"><select id="trace-block" aria-label="时间线配对批次" ${sampled.length<2?'disabled':''}>${sampled.map(b=>`<option value="${b.block}" ${b.block===traceBlock?'selected':''}>批次 ${b.block+1}</option>`).join('')}</select><select id="trace-request" aria-label="时间线请求">${requests.map(r=>`<option value="${r}" ${r===requestId?'selected':''}>请求 ${r}</option>`).join('')}</select><select id="trace-mode" aria-label="时间线实验组"><option value="control" ${traceMode==='control'?'selected':''}>控制组</option><option value="treatment" ${traceMode==='treatment'?'selected':''}>实验组</option></select></div></div>${timeline(c,pair)}<div id="span-detail" class="span-detail" aria-live="polite">选择跨度可查看已记录的父跨度。</div><p class="hint">仅列出已有跨度采样的批次与请求。重叠跨度分轨显示；轨道序号不表示父子层级。不是完整 await 依赖图。</p></div><div class="card"><h3>批次 ${pair.block+1} 控制组累计跨度耗时</h3><p class="hint">累计时间包含并行重叠与等待，不可直接相加为响应时间。</p><div class="scroll"><table><thead><tr><th>跨度</th><th>次数</th><th>累计</th><th>单次均值</th></tr></thead><tbody>${pair.control.operations.map(o=>`<tr><td>${esc(o.name)}<small class="type">${esc(o.kind)}</small></td><td>${o.count}</td><td>${num(o.total_ms)} ms</td><td>${num(o.mean_ms)} ms</td></tr>`).join('')}</tbody></table></div></div></section></div>${workloadView()}${calibrationView()}<footer>AwaitLab ${esc(report.library_version||'0.1')} · 可重跑的测量，不是对任意程序的加速承诺。</footer></main>`;
 document.querySelectorAll('[data-arm]').forEach(el=>el.onclick=()=>{selected=+el.dataset.arm;render();});
 document.getElementById('trace-mode').onchange=ev=>{traceMode=ev.target.value;render();};
 document.getElementById('trace-request').onchange=ev=>{requestId=+ev.target.value;render();};
 document.getElementById('trace-block').onchange=ev=>{traceBlock=+ev.target.value;render();};
 document.querySelectorAll('[data-span]').forEach(el=>el.onclick=()=>{
  const rows=pair[traceMode].trace,span=rows.find(r=>r.id===+el.dataset.span);
  const parent=rows.find(r=>r.id===span.parent);
  document.getElementById('span-detail').textContent=`#${span.id} ${span.name} · ${num(span.duration_ms)} ms · ${span.failed?'失败':'完成'} · 父跨度：${span.parent===null?'无（已记录根跨度）':parent?`#${parent.id} ${parent.name}`:`#${span.parent}（未采样）`}`;
 });
}
function timeline(c,pair){
 const sample=pair[traceMode],layout=AwaitLabTimeline.layout(sample.trace,requestId);
 if(!layout)return '<p class="hint">此批次未采样该请求。</p>';
 const {start,width,lanes}=layout;
 return `<div class="timeline" data-request="${requestId}" data-block="${pair.block}">${lanes.map(lane=>`<div class="lane"><span>${esc(lane.name)}</span><div>${lane.spans.map(r=>`<button type="button" data-span="${r.id}" class="bar ${esc(r.kind)} ${r.failed?'failed':''}" style="left:${100*(r.start_ms-start)/width}%;width:${100*r.duration_ms/width}%" title="${esc(r.name)} · ${num(r.duration_ms)} ms · #${r.id}" aria-label="${esc(r.name)} · #${r.id}">${esc(r.name)}</button>`).join('')}</div></div>`).join('')}</div><p class="hint">批次 ${pair.block+1} · 请求 ${requestId} · ${num(width)} ms · ${sample.trace_dropped?'部分跨度因采样上限被省略':'未触及跨度采样上限'}</p>`;
}
function calibrationView(){
 const calibration=report.timer_calibration;
 if(!calibration)return '';
 return `<details class="calibration"><summary>定时器校准 · 检查名义等待与实际等待的偏差</summary><div class="scroll"><table><thead><tr><th>请求等待</th><th>实测中位数</th><th>实测 p95</th></tr></thead><tbody>${calibration.sleep_samples.map(x=>`<tr><td>${x.requested_ms} ms</td><td>${num(x.p50_ms)} ms</td><td>${num(x.p95_ms)} ms</td></tr>`).join('')}</tbody></table></div><p class="hint">校准时空闲，实际干预还会受到运行中的任务调度影响。程序未修改系统定时器分辨率。</p></details>`;
}
render();
</script></body></html>
