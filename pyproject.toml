[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "awaitlab-local"
version = "0.16.1"
description = "Cooperative latency sensitivity and measured A/B experiments for asyncio"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
http = ["httpx>=0.28.1,<0.29"]

[project.scripts]
awaitlab = "awaitlab.__main__:main"

[tool.setuptools.packages.find]
include = ["awaitlab*"]

[tool.setuptools.package-data]
awaitlab = ["assets/*.js", "assets/*.css"]
